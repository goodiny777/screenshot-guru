name: Deploy (PR preview)

# Each pull request from this repository gets a temporary preview URL, posted as a
# PR comment. Pull requests from forks never receive the deploy key (GitHub does not
# pass secrets to fork PRs on the pull_request event), and the job is skipped for them.
# Do NOT change this to pull_request_target: that would run fork code with secrets.
on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCREENSHOT_GURU_11436 }}
          projectId: screenshot-guru-11436
          expires: 7d
      - name: Preview smoke
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.details_url }}"
